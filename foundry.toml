[profile.default]
src = "contracts"
test = "foundry/test"
script = "foundry/script"
out = "out"
cache_path = "cache_forge"
libs = ["node_modules", "lib"]
solc_version = "0.8.28"
# Arc targets the Osaka baseline; Prague bytecode is a subset of it.
evm_version = "prague"
optimizer = true
optimizer_runs = 200
remappings = [
    "solady/=node_modules/solady/",
    "@openzeppelin/=node_modules/@openzeppelin/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000

[rpc_endpoints]
arc = "${ARC_RPC_URL}"
